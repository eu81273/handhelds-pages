<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12151c" />
    <title>NEON OVERTAKE</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <script type="module" crossorigin src="./assets/index-Cd-w8N1f.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D9ToGJ9R.css">
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <a class="home-link" href="./" aria-label="NEON OVERTAKE 홈으로 이동">
          <p class="eyebrow">HIGHWAY 01</p>
          <h1>NEON<br />OVERTAKE</h1>
        </a>
        <div class="hud-stats" aria-label="게임 상태">
          <div class="score-card coin-card">
            <span>COINS</span>
            <strong id="coins">0</strong>
          </div>
          <div class="score-card">
            <span>LEVEL</span>
            <strong id="level">01</strong>
          </div>
          <div class="score-card">
            <span>SCORE</span>
            <strong id="score">00</strong>
          </div>
        </div>
      </header>

      <section class="game-wrap">
        <canvas id="game" aria-label="자동차 추월 게임"></canvas>
        <div class="touch-controls" id="touchControls" aria-label="방향 이동" hidden>
          <button type="button" data-direction="-1" aria-label="왼쪽으로 이동">←</button>
          <button type="button" data-direction="1" aria-label="오른쪽으로 이동">→</button>
        </div>

        <div class="start-screen" id="startScreen">
          <p class="status-label">READY TO RACE?</p>
          <h2>앞차를<br />추월하라</h2>
          <p>차를 추월할 때마다 코인 1개 획득!</p>
          <p>하단 방향 버튼 또는 <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd>로 이동</p>
          <button id="installButton" class="install-button hidden">INSTALL <span>＋</span></button>
          <button class="open-shop shop-button" type="button">코인 상점 <span>◈</span></button>
          <button id="startButton">START ENGINE <span>↵</span></button>
          <button id="shareButton" class="share-button">공유하기 <span>↗</span></button>
          <p id="shareStatus" class="share-status" role="status"></p>
        </div>

        <div class="game-over hidden" id="gameOver">
          <p class="status-label">RACE OVER</p>
          <h2>CRASHED!</h2>
          <p class="final-copy">FINAL SCORE <strong id="finalScore">00</strong></p>
          <button class="open-shop shop-button" type="button">코인 상점 <span>◈</span></button>
          <button id="restartButton">TRY AGAIN <span>↵</span></button>
        </div>
        <div class="shop-screen hidden" id="shopScreen" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
          <div class="shop-panel">
            <p class="status-label">GARAGE</p>
            <h2 id="shopTitle">코인 상점</h2>
            <p>보유 코인 <strong id="shopCoins">0</strong></p>
            <div id="shopList" class="shop-list"></div>
            <p id="shopStatus" class="shop-status" role="status"></p>
            <button id="closeShop" type="button">닫기</button>
          </div>
        </div>
      </section>

      <footer>
        <span>AVOID TRAFFIC</span>
        <span class="rule"></span>
        <span>CHASE THE HORIZON</span>
      </footer>
    </main>

  </body>
</html>
