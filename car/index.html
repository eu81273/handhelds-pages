<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12151c" />
    <title>NEON OVERTAKE</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <div>
          <p class="eyebrow">HIGHWAY 01</p>
          <h1>NEON<br />OVERTAKE</h1>
        </div>
        <div class="hud-stats" aria-label="게임 상태">
          <div class="score-card">
            <span>LEVEL</span>
            <strong id="level">01</strong>
          </div>
          <div class="score-card">
            <span>SCORE</span>
            <strong id="score">00</strong>
          </div>
        </div>
      </header>

      <section class="game-wrap">
        <canvas id="game" aria-label="자동차 추월 게임"></canvas>

        <div class="start-screen" id="startScreen">
          <p class="status-label">READY TO RACE?</p>
          <h2>앞차를 추월하라</h2>
          <p><kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>A</kbd> <kbd>D</kbd>로 이동</p>
          <button id="installButton" class="install-button hidden">INSTALL <span>＋</span></button>
          <button id="startButton">START ENGINE <span>↵</span></button>
        </div>

        <div class="game-over hidden" id="gameOver">
          <p class="status-label">RACE OVER</p>
          <h2>CRASHED!</h2>
          <p class="final-copy">FINAL SCORE <strong id="finalScore">00</strong></p>
          <button id="restartButton">TRY AGAIN <span>↵</span></button>
        </div>

        <div class="touch-controls" aria-label="터치 조작">
          <button id="leftButton" aria-label="왼쪽 이동">&lt;</button>
          <button id="rightButton" aria-label="오른쪽 이동">&gt;</button>
        </div>
      </section>

      <footer>
        <span>AVOID TRAFFIC</span>
        <span class="rule"></span>
        <span>CHASE THE HORIZON</span>
      </footer>
    </main>

    <script src="game.js"></script>
  </body>
</html>
